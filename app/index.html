<!doctype html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#101411" />
    <meta name="description" content="Read aloud, listen back, and retell in your own words. Private English speaking practice that stays on your device." />
    <link rel="icon" type="image/svg+xml" href="icon.svg" />
    <script>
      // Apply the saved or phone theme before first paint to avoid a wrong-theme flash.
      try {
        var t = (JSON.parse(localStorage.getItem('english-flow.settings.v1')) || {}).theme;
        if (t !== 'light' && t !== 'dark') {
          t = window.matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark';
        }
        document.documentElement.setAttribute('data-theme', t);
      } catch (e) {}
    </script>
    <title>English Flow</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
